name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: payntax, POSTGRES_USER: payntax, POSTGRES_PASSWORD: payntax-ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payntax" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ENV: test
      DJANGO_SECRET_KEY: ci-only-not-secret
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: payntax-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Generate a throwaway field-encryption key
        run: echo "FIELD_ENCRYPTION_KEYS=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - run: ruff check . && ruff format --check .
      - run: mypy .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --cov=apps --cov-report=term-missing
      - name: Contract is up to date (contract/openapi.yaml)
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -u ../contract/openapi.yaml /tmp/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Generated API types match the contract
        run: npm run api:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

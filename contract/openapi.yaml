openapi: 3.0.3
info:
  title: PayNTax API
  version: 0.1.0
  description: 'Contract between the PayNTax web app and API. Source of truth: contract/openapi.yaml.'
paths:
  /api/audit-events:
    get:
      operationId: audit_events_list
      description: 'SCR-11: the firm owner reads the firm''s audit log.'
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Filter by action prefix, e.g. 'client.'
      - in: query
        name: object_id
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - audit-events
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/auth/invitations/{token}:
    get:
      operationId: auth_invitation_preview
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
  /api/auth/invitations/{token}/accept:
    post:
      operationId: auth_invitation_accept
      description: Sign-in endpoints are rate limited per client (10/min).
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/auth/login:
    post:
      operationId: auth_login
      description: Sign-in endpoints are rate limited per client (10/min).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/auth/logout:
    post:
      operationId: auth_logout
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/mfa/setup:
    post:
      operationId: auth_mfa_setup
      description: 'SCR-02: start TOTP enrollment. Only allowed while the user has
        no confirmed device.'
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
          description: ''
  /api/auth/mfa/verify:
    post:
      operationId: auth_mfa_verify
      description: 'SCR-02: confirm enrollment or answer the challenge at sign-in.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/auth/session:
    get:
      operationId: auth_session
      description: Who is signed in and which step of sign-in they are at. Also sets
        the CSRF cookie.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/auth/signup:
    post:
      operationId: auth_signup
      description: 'SCR-01: a CPA creates a firm and becomes its owner (REQ-ACC-001).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/billing/checkout:
    post:
      operationId: billing_checkout
      description: 'SCR-03: start hosted checkout. The browser is redirected; card
        data never reaches us.'
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckoutRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Redirect'
          description: ''
  /api/billing/fake/complete:
    post:
      operationId: billing_fake_complete
      description: 'Local/dev only: stands in for the Stripe webhook that activates
        the subscription.'
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FakeCompleteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FakeCompleteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FakeCompleteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/billing/plans:
    get:
      operationId: billing_plans
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
          description: ''
  /api/billing/portal:
    post:
      operationId: billing_portal
      description: 'SCR-10: the owner manages billing in the provider''s portal (REQ-BIL-003).'
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Redirect'
          description: ''
  /api/billing/subscription:
    get:
      operationId: billing_subscription
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/clients:
    get:
      operationId: clients_list
      description: 'SCR-04 / SCR-05: create, search and edit clients (REQ-CLI-001).'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Name, email or SSN last 4
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientList'
          description: ''
    post:
      operationId: clients_create
      description: 'SCR-04 / SCR-05: create, search and edit clients (REQ-CLI-001).'
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
  /api/clients/{id}:
    get:
      operationId: clients_retrieve
      description: 'SCR-04 / SCR-05: create, search and edit clients (REQ-CLI-001).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this client.
        required: true
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    patch:
      operationId: clients_partial_update
      description: 'SCR-04 / SCR-05: create, search and edit clients (REQ-CLI-001).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this client.
        required: true
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClientRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    delete:
      operationId: clients_destroy
      description: 'SCR-04 / SCR-05: create, search and edit clients (REQ-CLI-001).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this client.
        required: true
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/clients/{id}/reveal-ssn:
    post:
      operationId: clients_reveal_ssn
      description: Show the full SSN. Owner and Preparer only; always audit logged.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this client.
        required: true
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealSsn'
          description: ''
  /api/documents:
    get:
      operationId: documents_list
      description: SCR-07 (upload and status) and SCR-08 (side-by-side review).
      parameters:
      - in: query
        name: tax_return
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
          description: ''
    post:
      operationId: documents_create_upload
      description: 'Step 1 of upload: register the file and get a pre-signed URL to
        PUT it to.'
      tags:
      - documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
          description: ''
  /api/documents/{id}:
    get:
      operationId: documents_retrieve
      description: SCR-07 (upload and status) and SCR-08 (side-by-side review).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document.
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
          description: ''
    delete:
      operationId: documents_destroy
      description: SCR-07 (upload and status) and SCR-08 (side-by-side review).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document.
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/documents/{id}/complete:
    post:
      operationId: documents_complete_upload
      description: 'Step 2 of upload: the browser finished the PUT; verify the object
        and queue processing.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document.
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
  /api/documents/{id}/fields/{field_id}:
    patch:
      operationId: documents_update_field
      description: 'SCR-08: correct a value or acknowledge a warning. Every change
        is audit logged.'
      parameters:
      - in: path
        name: field_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document.
        required: true
      tags:
      - documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFieldUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFieldUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFieldUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
          description: ''
  /api/documents/{id}/mark-reviewed:
    post:
      operationId: documents_mark_reviewed
      description: 'REQ-REV-004: only reviewed documents feed the return.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document.
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
          description: ''
  /api/documents/{id}/retry:
    post:
      operationId: documents_retry
      description: SCR-07 (upload and status) and SCR-08 (side-by-side review).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document.
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
  /api/documents/{id}/reveal-sensitive:
    post:
      operationId: documents_reveal_sensitive
      description: Show masked values (SSN) in full. Audit logged.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document.
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensitiveValues'
          description: ''
  /api/firm:
    get:
      operationId: firm_retrieve
      description: 'SCR-10: firm profile. Everyone can read it; only the owner can
        rename it.'
      tags:
      - firm
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Firm'
          description: ''
    patch:
      operationId: firm_partial_update
      description: 'SCR-10: firm profile. Everyone can read it; only the owner can
        rename it.'
      tags:
      - firm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFirmRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Firm'
          description: ''
  /api/firm/invitations:
    get:
      operationId: firm_invitations_list
      tags:
      - firm
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
    post:
      operationId: firm_invitations_create
      tags:
      - firm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
  /api/firm/invitations/{id}:
    delete:
      operationId: firm_invitations_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this invitation.
        required: true
      tags:
      - firm
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/firm/users:
    get:
      operationId: firm_users_list
      description: 'SCR-10: firm members. The owner changes roles or deactivates users
        (REQ-ACC-003).'
      tags:
      - firm
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: ''
  /api/firm/users/{id}:
    patch:
      operationId: firm_users_partial_update
      description: 'SCR-10: firm members. The owner changes roles or deactivates users
        (REQ-ACC-003).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - firm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFirmUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFirmUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFirmUserUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/health:
    get:
      operationId: health
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/returns:
    get:
      operationId: returns_list
      description: 'SCR-06: open a return for a client and tax year (REQ-CLI-002).'
      parameters:
      - in: query
        name: client
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - returns
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaxReturnList'
          description: ''
    post:
      operationId: returns_create
      description: 'SCR-06: open a return for a client and tax year (REQ-CLI-002).'
      tags:
      - returns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxReturnRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaxReturnRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaxReturnRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxReturn'
          description: ''
  /api/returns/{id}:
    get:
      operationId: returns_retrieve
      description: 'SCR-06: open a return for a client and tax year (REQ-CLI-002).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tax return.
        required: true
      tags:
      - returns
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxReturn'
          description: ''
    patch:
      operationId: returns_partial_update
      description: 'SCR-06: open a return for a client and tax year (REQ-CLI-002).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tax return.
        required: true
      tags:
      - returns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaxReturnUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTaxReturnUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTaxReturnUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxReturn'
          description: ''
  /api/returns/{id}/form-1040:
    get:
      operationId: form1040_retrieve
      description: 'SCR-09: 1040 lines computed from reviewed documents plus CPA edits.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - returns
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form1040'
          description: ''
  /api/returns/{id}/form-1040.pdf:
    get:
      operationId: form1040_pdf
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - returns
      security:
      - cookieAuth: []
      responses:
        '200':

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101", "E501"]  # assert is fine in tests; ruff format owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"apps/extraction/providers.py" = ["S311"]  # stub uses random for synthetic data, not security

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["migrations/"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"
